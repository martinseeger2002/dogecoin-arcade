[project]
name = "dogecoin-arcade"
version = "0.0.1"
description = "A sidecar Omni-style meta-layer for Dogecoin-family chains"
requires-python = ">=3.10"

# Pinned exactly, per the project ground rules. Arcade's dependency surface is
# deliberately tiny: an HTTP client, a ZMQ binding, and a test runner.
dependencies = [
    "requests==2.32.3",
    "pyzmq==26.2.0",
    "pynacl==1.5.0",
]

[project.optional-dependencies]
web = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "jinja2==3.1.5",
    "python-multipart==0.0.20",
]
dev = ["pytest==8.3.4"]

[project.scripts]
arcade-msg = "arcade.messaging.cli:main"
arcade-web = "arcade.web.__main__:main"
dogecoinarcade-update = "arcade.update:main"

[tool.setuptools]
# Only `arcade` is a package. Without this, setuptools sees installer/ as a
# second top-level package and refuses to build at all.
packages = ["arcade", "arcade.messaging", "arcade.web"]

[tool.setuptools.package-data]
"arcade.web" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
