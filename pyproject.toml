[project]
name = "dogecoin-arcade"
version = "0.0.1"
description = "A sidecar Omni-style meta-layer for Dogecoin-family chains"
requires-python = ">=3.10"

# Pinned exactly, per the project ground rules. Arcade's dependency surface is
# deliberately tiny: an HTTP client and the crypto library. Both are pure Python
# or ship abi3 wheels, so installing needs no compiler on any Python.
dependencies = [
    "requests==2.32.3",
    "pynacl==1.5.0",
]

[project.optional-dependencies]
# pyzmq is an extra, not a requirement. Nothing the application runs imports it
# -- `arcade.zmq_listener` is a faster wake-up than the 5-second poll and is not
# wired in yet -- and it is the one dependency with a C extension, so it is the
# one that needs a compiler when no wheel matches. A Windows user on a Python
# newer than the pin's wheels got "Failed to build 'pyzmq'" and no application,
# for a module that was never going to load. Install it with [zmq] to work on it.
zmq = ["pyzmq>=26.2"]
web = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "jinja2==3.1.5",
    "python-multipart==0.0.20",
]
# httpx is not optional: fastapi.testclient imports it, so without it the web
# tests do not skip -- collection ABORTS and the entire suite runs zero tests,
# including the several hundred that have nothing to do with the web. a test machine hit
# exactly that on a clean install: "1 error in 0.43s" and nothing ran.
#
# pytest is floated rather than pinned. The pin was not load-bearing -- the suite
# passes on 9.x -- and a hard pin makes the dev extra conflict with whatever else
# is in a contributor's environment for no benefit.
# selenium because one class of bug is invisible without a browser: the
# `hidden` attribute rendered anyway under an author display rule, and every
# markup-level check reported it as hidden while it was on screen.
# pillow because the chat bubble tail went wrong three times in a row in ways
# no computed-style check could see: a spur off the side, a sliver (a border
# radius wider than the box it was on), and a hairline (a clipped path whose
# two curves hugged each other). Each had a perfectly sane computed style.
# Counting painted pixels is the only check that can tell a tail from a line.
# Push notifications for the Messenger (arcade/push.py): the VAPID signature is
# ECDSA over P-256, which PyNaCl does not do. Without it the arcade simply does
# not offer notifications.
push = ["cryptography>=42"]
dev = ["pytest>=8.3", "httpx>=0.27", "selenium>=4.20", "pillow>=10.0", "cryptography>=42"]

[project.scripts]
arcade-msg = "arcade.messaging.cli:main"
arcade-web = "arcade.web.__main__:main"
arcade-admin-window = "arcade.adminwindow:main"
arcade-rpc = "arcade.rpccli:main"
dogecoinarcade-update = "arcade.update:main"

[tool.setuptools]
# Only `arcade` is a package. Without this, setuptools sees installer/ as a
# second top-level package and refuses to build at all.
packages = ["arcade", "arcade.messaging", "arcade.web"]

[tool.setuptools.package-data]
# Files that are DATA rather than code and must be in the wheel, or an
# installed copy is missing them while the source checkout works fine --
# which is the worst shape of bug this project can have, because the mini PC
# develops from a checkout and every other machine runs an installer build.
#
# `arcade/bip39-english.txt` is read at import time by arcade/seed.py, so
# leaving it out does not degrade anything: the application does not start.
"arcade" = ["bip39-english.txt"]
"arcade.web" = ["templates/*.html", "templates/*.js", "templates/*.md",
                "templates/*.png", "docs/*.md", "docs/*/*.md",
                "vendor/*.js", "vendor/*/*.js", "vendor/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Warnings are errors: a DeprecationWarning in our own code is a bug we want
    # to see now rather than when it becomes a removal.
    "error",
    # Starlette's TestClient imports a deprecated anyio alias at module level.
    # Third-party and unfixable from here; ignored specifically rather than by
    # weakening the rule above.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
