[project]
name = "dogecoin-arcade"
version = "0.0.1"
description = "A sidecar Omni-style meta-layer for Dogecoin-family chains"
requires-python = ">=3.10"

# Pinned exactly, per the project ground rules. Arcade's dependency surface is
# deliberately tiny: an HTTP client, a ZMQ binding, and a test runner.
dependencies = [
    "requests==2.32.3",
    "pyzmq==26.2.0",
    "pynacl==1.5.0",
]

[project.optional-dependencies]
web = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "jinja2==3.1.5",
    "python-multipart==0.0.20",
]
# httpx is not optional: fastapi.testclient imports it, so without it the web
# tests do not skip -- collection ABORTS and the entire suite runs zero tests,
# including the several hundred that have nothing to do with the web. a test machine hit
# exactly that on a clean install: "1 error in 0.43s" and nothing ran.
#
# pytest is floated rather than pinned. The pin was not load-bearing -- the suite
# passes on 9.x -- and a hard pin makes the dev extra conflict with whatever else
# is in a contributor's environment for no benefit.
# selenium because one class of bug is invisible without a browser: the
# `hidden` attribute rendered anyway under an author display rule, and every
# markup-level check reported it as hidden while it was on screen.
dev = ["pytest>=8.3", "httpx>=0.27", "selenium>=4.20"]

[project.scripts]
arcade-msg = "arcade.messaging.cli:main"
arcade-web = "arcade.web.__main__:main"
dogecoinarcade-update = "arcade.update:main"

[tool.setuptools]
# Only `arcade` is a package. Without this, setuptools sees installer/ as a
# second top-level package and refuses to build at all.
packages = ["arcade", "arcade.messaging", "arcade.web"]

[tool.setuptools.package-data]
"arcade.web" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Warnings are errors: a DeprecationWarning in our own code is a bug we want
    # to see now rather than when it becomes a removal.
    "error",
    # Starlette's TestClient imports a deprecated anyio alias at module level.
    # Third-party and unfixable from here; ignored specifically rather than by
    # weakening the rule above.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
