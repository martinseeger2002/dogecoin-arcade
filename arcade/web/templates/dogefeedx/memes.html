{% extends "base.html" %}
{% block title %}Meme Library · {{ brand.name }}{% endblock %}
{% block body %}
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { --df-text:#fff6dd; --df-muted:rgba(255,255,255,.55); --df-line:rgba(255,255,255,.12); }
* { box-sizing:border-box; }
body { margin:0; background:#000; color:var(--df-text); font-family:Nunito,sans-serif; }
html.indesk body.df-dogefeed, html.indesk body.df-dogefeed h1, html.indesk body.df-dogefeed h2 { background:#000 !important; color:#fff6dd !important; }
.wrap { max-width:960px; margin:0 auto; padding:28px 20px 48px; }
h1 { font-family:Fredoka,sans-serif; font-size:28px; margin:0 0 8px; }
h2 { font-family:Fredoka,sans-serif; font-size:18px; margin:22px 0 8px; }
p.note { color:var(--df-muted); border:0; background:transparent; padding:0; }
.pick { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:12px 0; }
.pick label, button.use, button.copy, button.drop {
  background:#f3e3a5; color:#000; border:0; border-radius:999px; padding:8px 14px; font-weight:700; cursor:pointer;
}
html.indesk body.df-dogefeed .pick label, html.indesk body.df-dogefeed button.use,
html.indesk body.df-dogefeed button.copy, html.indesk body.df-dogefeed button.drop {
  width:auto !important; height:auto !important; background:#f3e3a5 !important; color:#000 !important; box-shadow:none !important;
}
input[type=file] { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; margin-top:12px; }
.card { background:#0a0a0a; border:1px solid var(--df-line); border-radius:12px; padding:8px; }
.card img { width:100%; height:120px; object-fit:cover; border-radius:8px; background:#111; display:block; }
.card b { display:block; margin:6px 0; font-size:13px; word-break:break-word; }
.card .row { display:flex; gap:6px; flex-wrap:wrap; }
#said { min-height:1.2em; }
</style>
<script>document.body.classList.add('df-dogefeed');</script>
<div class="wrap">
  <h1>Meme Library</h1>
  <p class="note">Pictures you keep in this browser to attach to a local draft. Nothing is uploaded to dogefeed.app.</p>
  <div class="pick">
    <label for="meme-file">Pick a picture</label>
    <input id="meme-file" type="file" accept="image/*" multiple>
    <button type="button" class="drop" id="meme-clear">Clear library</button>
  </div>
  <p class="note" id="said"></p>
  <h2>Yours</h2>
  <div id="local-memes" class="grid"></div>
  <h2>Public</h2>
  <div id="memes" class="grid"><p class="note">Loading…</p></div>
</div>
<script>
(function () {
  var KEY = 'dogefeedx.memes';
  var DRAFT = 'dogefeedx.draftMeme';
  var box = document.getElementById('memes');
  var local = document.getElementById('local-memes');
  var said = document.getElementById('said');
  var file = document.getElementById('meme-file');
  function esc(s) { return String(s || '').replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function abs(url) { return url && url.charAt(0) === '/' ? 'https://dogefeed.app' + url : (url || ''); }
  function read() {
    try { return JSON.parse(localStorage.getItem(KEY) || '[]') || []; } catch (e) { return []; }
  }
  function write(rows) {
    try { localStorage.setItem(KEY, JSON.stringify(rows.slice(0, 24))); return true; }
    catch (e) { said.textContent = 'This browser would not keep that picture. Try a smaller one.'; return false; }
  }
  function shrink(blob) {
    return new Promise(function (resolve) {
      var img = new Image();
      var url = URL.createObjectURL(blob);
      img.onload = function () {
        var max = 240, scale = Math.min(1, max / Math.max(img.width, img.height));
        var canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = function () { URL.revokeObjectURL(url); resolve(''); };
      img.src = url;
    });
  }
  function paintLocal() {
    var rows = read();
    if (!rows.length) {
      local.innerHTML = '<p class="note">No pictures yet. Pick one from this computer.</p>';
      return;
    }
    local.innerHTML = rows.map(function (m) {
      return '<div class="card"><img src="' + m.data + '" alt=""><b>' + esc(m.name || 'Meme') + '</b>'
        + '<div class="row"><button type="button" class="use" data-id="' + esc(m.id) + '">Use in a post</button>'
        + '<button type="button" class="drop" data-id="' + esc(m.id) + '">Remove</button></div></div>';
    }).join('');
    local.querySelectorAll('button.use').forEach(function (b) {
      b.addEventListener('click', function () {
        var meme = read().filter(function (m) { return m.id === b.getAttribute('data-id'); })[0];
        if (!meme) return;
        try { localStorage.setItem(DRAFT, JSON.stringify({id: meme.id, name: meme.name, data: meme.data})); }
        catch (e) { said.textContent = 'Could not attach it.'; return; }
        said.textContent = 'Attached to your Home draft. Not sent to dogefeed.app.';
      });
    });
    local.querySelectorAll('button.drop').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-id');
        write(read().filter(function (m) { return m.id !== id; }));
        paintLocal();
      });
    });
  }
  file.addEventListener('change', function () {
    var files = Array.prototype.slice.call(file.files || []);
    file.value = '';
    if (!files.length) return;
    Promise.all(files.map(function (one) {
      return shrink(one).then(function (data) {
        return data ? {id: String(Date.now()) + '-' + files.length + '-' + (one.size || 0), name: one.name || 'Meme', data: data} : null;
      });
    })).then(function (made) {
      var rows = made.filter(Boolean).concat(read());
      if (write(rows)) said.textContent = 'Saved in this browser. Not sent to dogefeed.app.';
      paintLocal();
    });
  });
  document.getElementById('meme-clear').addEventListener('click', function () {
    try { localStorage.removeItem(KEY); } catch (e) {}
    paintLocal();
    said.textContent = 'Library cleared on this browser.';
  });
  paintLocal();
  fetch('/dogefeedx/api/memes')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var rows = data.memes || [];
      if (!rows.length) {
        box.innerHTML = '<p class="note">No public meme list. dogefeed.app does not publish one to read.</p>';
        return;
      }
      box.innerHTML = rows.map(function (m) {
        var src = abs(m.image);
        return '<div class="card">' + (src ? '<img src="' + esc(src) + '" alt="">' : '')
          + '<b>' + esc(m.name || 'Meme') + '</b>'
          + (src ? '<button type="button" class="copy" data-src="' + esc(src) + '">Copy link</button>' : '')
          + '</div>';
      }).join('');
      box.querySelectorAll('.copy').forEach(function (b) {
        b.addEventListener('click', function () {
          var src = b.getAttribute('data-src');
          if (navigator.clipboard) navigator.clipboard.writeText(src);
          b.textContent = 'Copied';
        });
      });
    })
    .catch(function () { box.innerHTML = '<p class="note">No public meme list.</p>'; });
})();
</script>
{% endblock %}
