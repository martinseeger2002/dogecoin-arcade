{% extends "base.html" %}
{% block title %}Messages · DogeFeed{% endblock %}
{% block body %}
{#- DogeFeedX Messages. Local to this arcade. No DogeFeed account. -#}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --df-gold: #f3e3a5;
  --df-gold-dark: #c9b56e;
  --df-gold-light: #fff8e7;
  --df-bg: #fff;
  --df-text: #0f1419;
  --df-text-secondary: #536471;
  --df-border: #eff3f4;
  --df-hover: #f7f9f9;
  --df-link: #1d9bf0;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--df-bg);
  color: var(--df-text);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }

.df-app {
  display: flex;
  max-width: 1280px;
  margin: 0 auto;
  min-height: 100vh;
}

.df-sidebar {
  width: 275px;
  padding: 12px;
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--df-border);
}
.df-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
  margin-bottom: 4px;
}
.df-logo svg {
  width: 32px;
  height: 32px;
}
.df-logo span {
  font-family: "Fredoka", sans-serif;
  font-size: 22px;
  font-weight: 600;
  color: var(--df-gold);
}
.df-nav {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
}
.df-nav-item {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 16px;
  border-radius: 9999px;
  font-size: 17px;
  font-weight: 500;
  color: var(--df-text);
  transition: background 0.15s;
}
.df-nav-item:hover {
  background: var(--df-hover);
}
.df-nav-item.active {
  font-weight: 700;
}
.df-nav-item svg {
  width: 24px;
  height: 24px;
  stroke: currentColor;
  stroke-width: 2;
  fill: none;
}
.df-nav-item.active svg {
  fill: currentColor;
}
.df-signin-btn {
  width: 100%;
  padding: 14px;
  border-radius: 9999px;
  border: none;
  background: var(--df-gold);
  color: #000;
  font-family: inherit;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  margin-top: auto;
  transition: background 0.15s;
}
.df-signin-btn:hover {
  background: var(--df-gold-dark);
}

.df-main {
  flex: 1;
  max-width: 600px;
  border-right: 1px solid var(--df-border);
}
.df-header {
  padding: 16px;
  border-bottom: 1px solid var(--df-border);
}
.df-header h1 {
  font-family: "Fredoka", sans-serif;
  font-size: 20px;
  font-weight: 600;
}

.df-signin-prompt {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 40px;
  text-align: center;
}
.df-signin-icon {
  width: 80px;
  height: 80px;
  background: var(--df-gold-light);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 24px;
}
.df-signin-icon svg {
  width: 40px;
  height: 40px;
  stroke: var(--df-gold);
  stroke-width: 2;
  fill: none;
}
.df-signin-prompt h2 {
  font-family: "Fredoka", sans-serif;
  font-size: 28px;
  font-weight: 600;
  margin-bottom: 8px;
}
.df-signin-prompt p {
  color: var(--df-text-secondary);
  font-size: 15px;
  margin-bottom: 24px;
  max-width: 320px;
}
.df-signin-prompt .df-signin-btn {
  width: auto;
  padding: 14px 32px;
}

.df-right {
  width: 350px;
  padding: 12px 24px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
.df-search {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-radius: 9999px;
  background: var(--df-hover);
  margin-bottom: 16px;
}
.df-search svg {
  width: 18px;
  height: 18px;
  color: var(--df-text-secondary);
}
.df-search input {
  flex: 1;
  border: none;
  background: none;
  font-family: inherit;
  font-size: 15px;
  color: var(--df-text);
  outline: none;
}
.df-search input::placeholder {
  color: var(--df-text-secondary);
}
.df-app { width: 100%; max-width: none; height: 100vh; overflow: hidden; }
.df-sidebar { width: 220px; flex: none; overflow: auto; position: relative; }
.df-main { flex: 1; min-width: 0; max-width: none; height: 100vh; overflow: auto; }
.df-right { width: 260px; flex: none; height: 100vh; overflow: auto; position: relative; }
html.indesk body.df-dogefeed { background: #000 !important; color: #fff6dd !important; }
html.indesk body.df-dogefeed h1, html.indesk body.df-dogefeed h2 { color: #fff6dd !important; }
html.indesk body.df-dogefeed .df-app, html.indesk body.df-dogefeed .df-sidebar, html.indesk body.df-dogefeed .df-main, html.indesk body.df-dogefeed .df-right, html.indesk body.df-dogefeed .df-header { background: #000 !important; color: #fff6dd !important; }
html.indesk body.df-dogefeed .df-signin-btn { background: #f3e3a5 !important; color: #000 !important; margin-top: 8px !important; position: static !important; }
html.indesk body.df-dogefeed .df-search { background: #111 !important; }
</style>
<script>document.body.classList.add('df-dogefeed');</script>

<div class="df-app">
  

  <main class="df-main">
    <div class="df-header">
      <h1>Messages</h1>
    </div>
    
    <p class="df-empty" id="msg-note">Your DMs stay on this arcade. They are not sent through dogefeed.app.</p>
    <form id="dm" style="display:flex;gap:8px;padding:12px 16px">
      <input id="dm-to" type="text" placeholder="@name or address" aria-label="Start a DM" style="flex:1;border:1px solid var(--df-border);border-radius:999px;padding:10px 14px;background:transparent;color:inherit">
      <button class="df-signin-btn" type="submit" style="width:auto;padding:10px 16px">Start a DM</button>
      <button class="df-signin-btn" type="button" id="new-group" style="width:auto;padding:10px 16px">New group</button>
    </form>
    <div id="msg-thread"></div>
  </main>
<script>
(function () {
  var thread = document.getElementById('msg-thread');
  function note(text) {
    thread.innerHTML = '<p class="df-empty">' + text + '</p>';
  }
  document.getElementById('dm').addEventListener('submit', function (e) {
    e.preventDefault();
    var to = document.getElementById('dm-to').value.trim();
    if (!to) return;
    note('A DM to ' + to.replace(/[&<>"']/g, '') + ' stays on this arcade. It is not sent through dogefeed.app.');
  });
  document.getElementById('new-group').addEventListener('click', function () {
    note('Name the group in the field above. It stays on this arcade.');
  });
})();
</script>

  
</div>
{% endblock %}
