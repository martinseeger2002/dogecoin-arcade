{# Finishing an offer the holder answered (2026-09-26). Every element with
   data-answer-for="<offer txid>" gets a "Complete the purchase" button once this
   browser finds the seller's answer to that offer among its sealed program
   messages (wallet.answersToMe); a refusal says so instead. #}
<script type="module">
import * as wallet from "/wallet.js";

const CHAIN = {network: "{{ chain.network }}",
               version: {{ chain.params.pubkeyhash_version }}};
const news = document.getElementById("fill-news");
const say = (text, ok) => {
  if (!news) return;
  news.textContent = text; news.hidden = !text;
  news.className = "msg " + (ok ? "ok" : "err");
};
const spots = [...document.querySelectorAll("[data-answer-for]")];

(async () => {
  if (!spots.length) return;
  const held = await wallet.opened(CHAIN);
  if (!held) return;
  let answers = {};
  try { answers = await wallet.answersToMe(held); } catch (e) { return; }
  for (const spot of spots) {
    const answer = answers[spot.dataset.answerFor];
    if (!answer) continue;
    if (spot.dataset.busy) {
      // Its coins are already in a swap that has not reached a block; a second
      // one would spend them twice (a stuck soft-dust swap sat for days).
      spot.innerHTML = '<span class="muted">a trade of this piece is waiting for its block</span>';
      continue;
    }
    if (!answer.ok || !answer.leg) {
      spot.innerHTML = '<span class="muted">refused</span>';
      continue;
    }
    const button = document.createElement("button");
    button.type = "button";
    button.className = "small";
    button.textContent = "Complete the purchase";
    const piece = spot.dataset.number ? `#${spot.dataset.number}` : "this piece";
    button.onclick = async () => {
      say("");
      button.disabled = true;
      const was = button.textContent;
      button.textContent = "Completing…";
      try {
        const offer = await wallet.offerFill(answer.leg, CHAIN.network);
        const shown = await wallet.checked(offer, held);
        // Said as the trade, not as the outputs: the seller's own coin passes
        // through this transaction and back to them, and listing it read as
        // though the buyer paid it (filming, 2026-09-26).
        const seller = offer.seller_tag ? "@" + offer.seller_tag
                     : String(offer.seller || "the holder").slice(0, 12) + "\u2026";
        const ok = await arcadeAsk("Complete the purchase?",
          `Pay ${spot.dataset.price} to ${seller}, get ${piece}. The network fee is `
          + `${shown.coinsOf(shown.fee)}. Their signature is already on the piece; your `
          + "key signs the payment here, and one transaction moves both or neither.",
          "Complete it");
        if (!ok) { button.disabled = false; button.textContent = was; return; }
        const out = await wallet.fill(held, answer.leg, offer);
        // Sent, not bought: until a block holds it, it is a transaction this node
        // relayed, and the page says so (filming, 2026-09-26).
        spot.innerHTML = '<span class="pill warn">sent &mdash; waiting for its block</span>';
        say(`Sent in ${String(out.txid).slice(0, 16)}… ${piece} is yours when its `
            + "block lands, usually within a few minutes.", true);
      } catch (e) {
        say(String(e.message || e), false);
        button.disabled = false; button.textContent = was;
      }
    };
    spot.textContent = "";
    spot.appendChild(button);
  }
})();
</script>
