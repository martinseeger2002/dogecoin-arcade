<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>%%ONE%% Mintpad</title>
<!--
  A mintpad that is an inscription. Its JSON names a shop (a random %%ONE%% for
  Arcade Test); this page is the storefront. Nothing is embedded: every picture
  is another inscription, fetched from /content/<id> on the node it is viewed
  on, so the wall is the collection itself.
-->
<style>
  :root { color-scheme: dark; --gold:#ffc83d; --pink:#ff5fa2; --cyan:#43e8ff;
          --ink:#07060c; --card:rgba(12,10,22,.78); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--ink); color:#f4f1ff;
              font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; }

  /* ---- the wall: every tile is a %%ONE%%, and any of them may turn over ---- */
  #wall { position:fixed; inset:-4vmin; display:grid; gap:6px; padding:6px;
          grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); grid-auto-rows:88px;
          transform:rotate(-6deg) scale(1.12); filter:saturate(1.15); }
  .tile { perspective:600px; }
  .flip { position:relative; width:100%; height:100%; transform-style:preserve-3d;
          transition:transform .9s cubic-bezier(.3,1.4,.5,1); }
  .flip.over { transform:rotateY(180deg); }
  .face { position:absolute; inset:0; border-radius:12px; backface-visibility:hidden;
          background:#1a1530 center/cover no-repeat; image-rendering:pixelated;
          box-shadow:0 0 0 1px rgba(255,255,255,.06) inset; }
  .face.back { transform:rotateY(180deg); }
  #veil { position:fixed; inset:0; pointer-events:none;
          background:radial-gradient(ellipse at 50% 45%, rgba(7,6,12,.25) 0%, rgba(7,6,12,.82) 62%, rgba(7,6,12,.97) 100%); }

  /* ---- the machine ---- */
  main { position:relative; z-index:1; height:100%; display:grid; place-items:center; padding:16px; }
  .pad { width:min(440px,100%); text-align:center; background:var(--card);
         border:1px solid rgba(255,255,255,.12); border-radius:26px; padding:22px 22px 18px;
         backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
         box-shadow:0 0 60px rgba(255,95,162,.18), 0 30px 80px rgba(0,0,0,.6); }
  h1 { margin:0; font-size:clamp(1.6rem,6vw,2.3rem); letter-spacing:-.03em; line-height:1.05;
       background:linear-gradient(90deg,var(--gold),var(--pink),var(--cyan),var(--gold));
       background-size:300% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
       animation:shine 6s linear infinite; }
  @keyframes shine { to { background-position:300% 0; } }
  .sub { margin:4px 0 16px; color:rgba(244,241,255,.62); font-size:.9rem; }

  /* the reel: a window onto a strip of %%MANY%% that runs until one is yours */
  .reel { position:relative; width:220px; height:220px; margin:0 auto 14px; border-radius:22px;
          overflow:hidden; background:#110d22;
          box-shadow:0 0 0 3px var(--gold), 0 0 0 7px rgba(255,200,61,.18), 0 0 40px rgba(255,200,61,.35); }
  .reel::before, .reel::after { content:""; position:absolute; left:0; right:0; height:34%; z-index:2; pointer-events:none; }
  .reel::before { top:0; background:linear-gradient(#110d22,transparent); }
  .reel::after { bottom:0; background:linear-gradient(transparent,#110d22); }
  #strip { position:absolute; left:0; top:0; width:100%; will-change:transform; }
  #strip div { width:220px; height:220px; background:#1a1530 center/cover no-repeat; image-rendering:pixelated; }
  .reel.won { animation:won 1.1s ease-out 3; }
  @keyframes won { 50% { box-shadow:0 0 0 3px var(--cyan), 0 0 0 10px rgba(67,232,255,.35), 0 0 80px rgba(67,232,255,.7); } }
  .pointer { position:absolute; top:50%; width:0; height:0; z-index:3; border:12px solid transparent; transform:translateY(-50%); }
  .pointer.l { left:-2px; border-left-color:var(--gold); }
  .pointer.r { right:-2px; border-right-color:var(--gold); }

  .price { font-size:1.05rem; margin:0 0 12px; }
  .price b { color:var(--gold); }
  button { font:inherit; font-weight:800; font-size:1.1rem; letter-spacing:.02em; border:0; cursor:pointer;
           width:100%; padding:14px 18px; border-radius:16px; color:#1a1024;
           background:linear-gradient(90deg,var(--gold),var(--pink)); box-shadow:0 8px 26px rgba(255,95,162,.35);
           transition:transform .15s, filter .15s; }
  button:hover:not(:disabled) { transform:translateY(-2px); filter:brightness(1.08); }
  button:disabled { cursor:default; background:rgba(255,255,255,.12); color:rgba(255,255,255,.5); box-shadow:none; }
  #step { min-height:2.9em; margin:12px 0 0; font-size:.86rem; color:rgba(244,241,255,.72); }
  #step.bad { color:#ff8a8a; }
  #step.good { color:var(--cyan); font-weight:700; }
  #foot { margin-top:8px; font-size:.74rem; color:rgba(244,241,255,.42); word-break:break-word; }
  .dots::after { content:""; animation:dots 1.4s steps(4) infinite; }
  @keyframes dots { 0%{content:""} 25%{content:"."} 50%{content:".."} 75%{content:"..."} }
  @media (prefers-reduced-motion:reduce) { .flip { transition:none; } h1 { animation:none; } }
</style>

<div id="wall" aria-hidden="true"></div>
<div id="veil"></div>

<main>
  <div class="pad">
    <h1>%%TITLE%%</h1>
    <p class="sub" id="left">loading the collection<span class="dots"></span></p>
    <div class="reel" id="reel">
      <div id="strip"></div>
      <span class="pointer l"></span><span class="pointer r"></span>
    </div>
    <p class="price" id="price">&nbsp;</p>
    <button id="buy" disabled>Mint a random %%ONE%%</button>
    <p id="step"></p>
    <p id="foot"></p>
  </div>
</main>

<script src="/r/swap.js"></script>
<script>
(function () {
  'use strict';
  // The collection this pad sells. The shop's own JSON is the authority on the
  // price and on what is given; these two name where the pictures come from.
  var CREATOR = '%%CREATOR%%', COLLECTION = '%%COLLECTION%%';
  var LISTING = 0, CELL = 220;

  var $ = function (id) { return document.getElementById(id); };
  var items = [], busy = false, shop = null;

  function url(id) { return '/content/' + id; }
  function pick() { return items[Math.floor(Math.random() * items.length)]; }
  function say(text, kind) { var s = $('step'); s.textContent = text; s.className = kind || ''; }
  function getJSON(path) {
    return fetch(path).then(function (r) {
      return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return j; });
    });
  }

  // ---- the collection, a page of 100 at a time ------------------------------
  function loadCollection() {
    var all = [];
    function page(offset) {
      return getJSON('/r/collection/' + CREATOR + '/' + COLLECTION + '?limit=100&offset=' + offset)
        .then(function (c) {
          all = all.concat(c.items || []);
          return (c.items || []).length === 100 && all.length < c.count ? page(offset + 100) : c;
        });
    }
    return page(0).then(function (c) { items = all; return c; });
  }

  // ---- the wall -------------------------------------------------------------
  function buildWall() {
    var wall = $('wall'), cols = Math.ceil((innerWidth * 1.25) / 94) + 1,
        rows = Math.ceil((innerHeight * 1.25) / 94) + 1, n = cols * rows, frag = document.createDocumentFragment();
    wall.innerHTML = '';
    for (var i = 0; i < n; i++) {
      var tile = document.createElement('div'), flip = document.createElement('div'),
          front = document.createElement('div'), back = document.createElement('div');
      tile.className = 'tile'; flip.className = 'flip'; front.className = 'face'; back.className = 'face back';
      front.style.backgroundImage = 'url(' + url(pick().id) + ')';
      back.style.backgroundImage = 'url(' + url(pick().id) + ')';
      flip.appendChild(front); flip.appendChild(back); tile.appendChild(flip); frag.appendChild(tile);
    }
    wall.appendChild(frag);
  }

  function flipSome() {
    // A few random tiles turn over; the face now hidden takes a new %%ONE%%, so
    // the next turn shows something else. Browsers cache /content/ for a year.
    var flips = document.querySelectorAll('.flip');
    if (!flips.length) return;
    var count = 2 + Math.floor(Math.random() * 4);
    for (var i = 0; i < count; i++) {
      var f = flips[Math.floor(Math.random() * flips.length)], over = f.classList.toggle('over');
      var hidden = f.children[over ? 0 : 1];
      (function (face) {
        setTimeout(function () { face.style.backgroundImage = 'url(' + url(pick().id) + ')'; }, 950);
      })(hidden);
    }
  }

  // ---- the reel -------------------------------------------------------------
  var reel = {pos: 0, speed: 0, target: null, raf: 0, onStop: null};

  function fillStrip(finalId) {
    var strip = $('strip'), frag = document.createDocumentFragment();
    strip.innerHTML = '';
    for (var i = 0; i < 40; i++) {
      var d = document.createElement('div');
      d.style.backgroundImage = 'url(' + url(i === 39 && finalId ? finalId : pick().id) + ')';
      frag.appendChild(d);
    }
    strip.appendChild(frag);
  }

  function frame() {
    var height = 40 * CELL;
    if (reel.target === null) {
      reel.speed = Math.min(reel.speed + 1.2, 38);          // spin up, then hold
      reel.pos = (reel.pos + reel.speed) % (height - CELL * 2);
    } else {
      // ease into the last cell, where the %%ONE%% that landed was placed
      var remaining = reel.target - reel.pos;
      reel.pos += Math.max(remaining * 0.06, 0.6);
      if (remaining <= 0.8) {
        reel.pos = reel.target;
        $('strip').style.transform = 'translateY(' + (-reel.pos) + 'px)';
        cancelAnimationFrame(reel.raf); reel.raf = 0;
        if (reel.onStop) reel.onStop();
        return;
      }
    }
    $('strip').style.transform = 'translateY(' + (-reel.pos) + 'px)';
    reel.raf = requestAnimationFrame(frame);
  }

  function spin() {
    $('reel').classList.remove('won');
    fillStrip(null); reel.pos = 0; reel.speed = 0; reel.target = null;
    if (!reel.raf) reel.raf = requestAnimationFrame(frame);
  }

  function landOn(id) {
    // Swap the last cell for the real %%ONE%% and glide onto it from a few
    // cells above, so the stop always reads as the reel slowing into place.
    return new Promise(function (resolve) {
      var strip = $('strip'), last = strip.lastChild;
      last.style.backgroundImage = 'url(' + url(id) + ')';
      reel.pos = CELL * 30;
      reel.target = CELL * 39;
      reel.onStop = function () { $('reel').classList.add('won'); resolve(); };
      if (!reel.raf) reel.raf = requestAnimationFrame(frame);
    });
  }

  function idle() {
    fillStrip(null);
    $('strip').style.transform = 'translateY(0)';
  }

  // ---- the shop -------------------------------------------------------------
  function describeTake(l) { return arcade.swap.describe(l.take); }

  function draw() {
    var held = items.filter(function (it) { return it.owner === CREATOR; }).length;
    $('left').textContent = held + ' of ' + items.length + ' %%MANY%% left to mint';
    if (!shop) return;
    var l = shop.listings[LISTING];
    $('price').innerHTML = l ? 'Price: <b></b>' : 'this pad lists nothing';
    if (l) $('price').querySelector('b').textContent = describeTake(l);
    var btn = $('buy');
    btn.disabled = busy || !l || !!l.available || !shop.open || !shop.ready || shop.mine || held === 0;
    btn.textContent = busy ? 'Minting…' : held === 0 ? 'Sold out' : 'Mint a random %%ONE%%';
    $('foot').textContent =
      !shop.ready ? 'This chain reads swaps from block ' + shop.from + '; it is at ' + shop.height + '.'
      : !shop.open ? 'This mintpad is closed: its creator no longer holds it.'
      : shop.mine ? 'This is your mintpad. Buyers see a live Mint button here.'
      : l && l.available ? l.available
      : 'Sold by ' + shop.seller + '.';
  }

  // Minting needs a wallet around the page: arcade.swap asks the frame's
  // parent. Opened on its own (a /content/ URL in a tab) the page is its own
  // parent, hears its own question echoed back, and would say only "refused".
  var inWallet = window.parent !== window;

  function refresh() {
    return Promise.all([
      loadCollection(),
      inWallet ? arcade.swap.shop().then(function (s) { shop = s; }, function (e) {
        shop = null; $('foot').textContent = e.message;
      }) : Promise.resolve().then(function () {
        shop = null;
        $('foot').textContent = 'Open this mintpad in a DogecoinArcade wallet to mint.';
      })
    ]).then(draw);
  }

  function ownerOf(id) {
    return getJSON('/r/inscription/' + id).then(function (row) { return row.owner; });
  }

  function waitUntilLanded(id, buyer, seller, txid) {
    // The swap is sent when the shop signs; it is YOURS when a block holds it
    // and this node's ledger names the buyer as the owner. If the swap is well
    // buried and the %%ONE%% belongs to somebody else entirely, another buyer
    // was sold it first: the swap is one transaction, so it went invalid and
    // nothing of the buyer's moved. Say that, rather than spin for an hour.
    return new Promise(function (resolve, reject) {
      var deadline = Date.now() + 60 * 60 * 1000;
      (function check() {
        Promise.all([getJSON('/r/tx/' + txid).catch(function () { return {}; }), ownerOf(id)])
          .then(function (r) {
            var conf = r[0].confirmations || 0, owner = r[1];
            if (owner === buyer) return resolve();
            if (conf >= 2 && owner !== seller) {
              return reject(new Error('another buyer got that %%ONE%% a moment before you; ' +
                'your swap did nothing and none of your tokens moved. Try again.'));
            }
            say(conf ? 'in block, ' + conf + ' confirmation' + (conf === 1 ? '' : 's') + '; waiting for the ledger to hand it over'
                     : 'swap sent; waiting for a block', '');
            if (Date.now() > deadline) return reject(new Error('the %%ONE%% has not arrived yet; it will, keep this page open'));
            setTimeout(check, 5000);
          }, function () { setTimeout(check, 5000); });
      })();
    });
  }

  function mint() {
    if (busy) return;
    busy = true; draw(); spin();
    var S = arcade.swap, offer, give;
    say('asking the mintpad for a %%ONE%%…');
    S.shop().then(function (s) {
      shop = s;
      if (!s.ready) throw new Error('swaps are read from block ' + s.from);
      if (s.mine) throw new Error('this is your own mintpad');
      return S.offer(LISTING);
    }).then(function (sent) {
      say('asked; waiting for the mintpad to pick one (a block or two)');
      return S.awaitOffer(sent.txid);
    }).then(function (o) {
      offer = o; give = o.give;
      say('a %%ONE%% is reserved for you; approve it in your wallet');
      return S.accept(o);
    }).then(function (r) {
      return S.awaitDecision(r.request);
    }).then(function () {
      say('approved; waiting for the mintpad');
      return S.awaitSwap(offer);
    }).then(function (done) {
      var id = give.txid || give.id;
      return waitUntilLanded(id, offer.buyer, offer.seller, done.txid).then(function () {
        say('landing…');
        return landOn(id).then(function () {
          return getJSON('/r/inscription/' + id).then(function (row) {
            var name = (row.json && row.json.name) || ('inscription #' + row.number);
            say(name + ' is yours! (swap ' + done.txid.slice(0, 12) + '…)', 'good');
          });
        });
      });
    }).catch(function (e) {
      cancelAnimationFrame(reel.raf); reel.raf = 0; idle();
      say(e.message, 'bad');
    }).then(function () {
      busy = false; refresh();
    });
  }

  $('buy').addEventListener('click', mint);

  loadCollection().then(function () {
    buildWall(); idle(); draw();
    setInterval(flipSome, 700);
    var resized; addEventListener('resize', function () { clearTimeout(resized); resized = setTimeout(buildWall, 250); });
    return refresh();
  }).catch(function (e) { say('could not read the collection: ' + e.message, 'bad'); });
  setInterval(function () { if (!busy) refresh(); }, 60000);
})();
</script>
