<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>%%NAME%% — for sale</title>
<!-- One NFT for sale: this page's JSON names a shop whose only listing gives
     %%PIECE%%. The picture is that piece, fetched from the node this is
     opened on, so what is drawn is what changes hands. -->
<style>
  :root { color-scheme:dark; --gold:#ffc83d; --pink:#ff5fa2; --cyan:#43e8ff; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:#07060c; color:#f4f1ff;
              font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { min-height:100vh; display:grid; place-items:center; padding:18px; }
  .card { width:min(420px,100%); text-align:center; padding:20px; border-radius:24px;
          background:rgba(12,10,22,.78); border:1px solid rgba(255,255,255,.12);
          box-shadow:0 30px 80px rgba(0,0,0,.6); }
  h1 { margin:0 0 2px; font-size:1.6rem; letter-spacing:-.02em; color:var(--gold); }
  .sub { margin:0 0 14px; color:rgba(244,241,255,.62); font-size:.85rem; }
  .art { width:100%; aspect-ratio:1/1; border-radius:18px; image-rendering:pixelated;
         background:#110d22 center/contain no-repeat; box-shadow:0 0 0 3px var(--gold); }
  .price { margin:14px 0 4px; font-size:1.15rem; } .price b { color:var(--cyan); }
  button { width:100%; margin-top:12px; padding:13px 16px; border:0; border-radius:14px;
           font:inherit; font-weight:700; cursor:pointer; color:#1a1024;
           background:linear-gradient(90deg,var(--gold),var(--pink)); }
  button[disabled] { opacity:.5; cursor:default; }
  .say { margin-top:12px; min-height:2.6em; font-size:.86rem; color:rgba(244,241,255,.75); }
  .say.bad { color:#ff8b8b; } .say.good { color:#7bf5a8; }
  .foot { margin-top:10px; font-size:.76rem; color:rgba(244,241,255,.45); word-break:break-all; }
</style>
<main>
  <div class="card">
    <h1 id="name">%%NAME%%</h1>
    <p class="sub" id="what">for sale</p>
    <div class="art" id="art" style="background-image:url(/content/%%PIECE%%)"></div>
    <p class="price" id="price">Price: <b>%%PRICE%%</b></p>
    <button id="buy" disabled>Buy it</button>
    <p class="say" id="say"></p>
    <p class="foot" id="foot"></p>
  </div>
</main>
<script src="/r/swap.js"></script>
<script>
(function () {
  var PIECE = '%%PIECE%%', LISTING = 0, shop = null, busy = false;
  function $(id) { return document.getElementById(id); }
  function say(text, how) { $('say').textContent = text || ''; $('say').className = 'say ' + (how || ''); }
  function getJSON(url) {
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error(url + ' says ' + r.status);
      return r.json();
    });
  }

  // arcade.swap asks the frame's parent, so a wallet has to be around the
  // page; on its own it would hear its own question echoed back.
  var inWallet = window.parent !== window;

  function draw() {
    var l = shop && shop.listings[LISTING];
    if (l) {
      $('price').innerHTML = 'Price: <b></b>';
      $('price').querySelector('b').textContent = arcade.swap.describe(l.take);
    }
    var btn = $('buy');
    btn.disabled = busy || !shop || !l || !!l.available || !shop.open ||
                   !shop.ready || shop.mine;
    btn.textContent = busy ? 'Buying…' : 'Buy it';
    $('foot').textContent =
      !inWallet ? 'Open this in a DogecoinArcade wallet to buy it.'
      : !shop ? ''
      : !shop.ready ? 'This chain reads swaps from block ' + shop.from + '; it is at ' + shop.height + '.'
      : !shop.open ? 'This listing is closed: whoever wrote it no longer holds it.'
      : shop.mine ? 'This is your listing. A buyer sees a live Buy button here.'
      : l && l.available ? l.available
      : 'Sold by ' + shop.seller + '.';
  }

  function refresh() {
    var asked = inWallet
      ? arcade.swap.shop().then(function (s) { shop = s; },
                               function (e) { shop = null; say(e.message, 'bad'); })
      : Promise.resolve();
    return asked.then(draw);
  }

  function describePiece() {
    return getJSON('/r/inscription/' + PIECE).then(function (row) {
      $('name').textContent = (row.json && row.json.name) || ('Inscription #' + row.number);
      $('what').textContent = row.collection
        ? row.collection + (row.edition != null ? ' #' + row.edition : '') +
          ' · inscription #' + row.number
        : 'inscription #' + row.number;
    }).catch(function () { /* not indexed here; the page still reads */ });
  }

  function waitUntilLanded(buyer, seller, txid) {
    // It is yours when a block holds the swap and this node's ledger says so.
    // Buried, and owned by neither of you: somebody bought it first, the swap
    // went invalid, and nothing of yours moved. Say so rather than spin.
    return new Promise(function (resolve, reject) {
      var deadline = Date.now() + 60 * 60 * 1000;
      (function check() {
        Promise.all([getJSON('/r/tx/' + txid).catch(function () { return {}; }),
                     getJSON('/r/inscription/' + PIECE)])
          .then(function (r) {
            var conf = r[0].confirmations || 0, owner = r[1].owner;
            if (owner === buyer) return resolve();
            if (conf >= 2 && owner !== seller) {
              return reject(new Error('somebody bought it a moment before you; your swap ' +
                'did nothing and none of your coins moved.'));
            }
            say(conf ? conf + ' confirmation' + (conf === 1 ? '' : 's') +
                       '; waiting for the ledger'
                     : 'swap sent; waiting for a block');
            if (Date.now() > deadline) {
              return reject(new Error('it has not arrived yet; it will, keep this page open'));
            }
            setTimeout(check, 5000);
          }, function () { setTimeout(check, 5000); });
      })();
    });
  }

  function buy() {
    if (busy) return;
    busy = true; draw();
    var S = arcade.swap, offer;
    say('asking the seller for an offer…');
    S.shop().then(function (s) {
      shop = s;
      if (!s.ready) throw new Error('swaps are read from block ' + s.from);
      if (s.mine) throw new Error('this is your own listing');
      return S.offer(LISTING);
    }).then(function (sent) {
      say('asked; waiting for their node to answer (a block or two)');
      return S.awaitOffer(sent.txid);
    }).then(function (o) {
      offer = o;
      say('it is reserved for you; approve the transaction in your wallet');
      return S.accept(o);
    }).then(function (r) {
      return S.awaitDecision(r.request);
    }).then(function () {
      say('approved; waiting for the seller to sign and send');
      return S.awaitSwap(offer);
    }).then(function (done) {
      return waitUntilLanded(offer.buyer, offer.seller, done.txid).then(function () {
        say('it is yours! (swap ' + done.txid.slice(0, 12) + '…)', 'good');
      });
    }).catch(function (e) {
      say(e.message, 'bad');
    }).then(function () {
      busy = false; refresh();
    });
  }

  $('buy').addEventListener('click', buy);
  describePiece().then(refresh);
  setInterval(function () { if (!busy) refresh(); }, 60000);
})();
</script>
